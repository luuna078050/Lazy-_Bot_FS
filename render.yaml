services:
  - type: web
    name: lazybot-fs
    runtime: python
    buildCommand: pip install -r requirements.txt && pytest -q
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRADING_MODE
        value: paper
      - key: PYTHON_VERSION
        value: 3.12.2
