name: Apply Fast Scalper repair
on:
  push:
    branches: [fast-scalper-8d9d5ee-test]
    paths: [.github/workflows/apply-fast-scalper-repair.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Fast Scalper
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/fast_scalper_v042.py')
          s=p.read_text()
          s=s.replace("'source':'Binance WebSocket','prices':{}}", "'source':'Binance WebSocket','prices':{},'auto_fill_enabled':True}")
          s=s.replace("def fill_auto_slots():\n    if any(S['slots']) or not S['ranking']:return", "def fill_auto_slots():\n    if not S.get('auto_fill_enabled',True) or any(S['slots']) or not S['ranking']:return")
          s=s.replace("def close_position(p,reason):\n    ep=p['entry']; xp=(qprice(p['symbol']) or ep)*(1+random.uniform(-.0012,.0025)); pnl=(xp/ep-1)*p['stake'];", "def close_position(p,reason,exit_price=None):\n    ep=p['entry']; xp=float(exit_price if exit_price is not None else (qprice(p['symbol']) or ep)); pnl=(xp/ep-1)*p['stake'];")
          s=s.replace("async def manage_positions():\n    if not S['positions']:return\n    for p in list(S['positions']):\n        p['current']=qprice(p['symbol']) or p['current'];age=time.time()-p['opened'];live=(p['current']/p['entry']-1)*100\n        if S['profit']>0 and live>=S['profit']:close_position(p,'PROFIT_TARGET')\n        elif age>=MAX_POSITION_SECONDS:close_position(p,'TIMEOUT')\n        elif age>=ROTATE_SECONDS:close_position(p,'ROTATION')", "async def manage_positions():\n    if not S['positions']:return\n    for p in list(S['positions']):\n        age=time.time()-p['opened']\n        if age>=MAX_POSITION_SECONDS:\n            close_position(p,'TIMEOUT',p.get('current') or p['entry'])\n            continue\n        p['current']=qprice(p['symbol']) or p['current'];live=(p['current']/p['entry']-1)*100\n        if S['profit']>0 and live>=S['profit']:close_position(p,'PROFIT_TARGET',p['current'])\n        elif age>=ROTATE_SECONDS:close_position(p,'ROTATION',p['current'])")
          s=s.replace("class Slots(BaseModel): slots:list[str]=Field(default_factory=list,max_length=MAX_SLOTS); profit_pct:float=Field(0,ge=0,le=80); reinvest:bool=False", "class Slots(BaseModel): slots:list[str]=Field(default_factory=list,max_length=MAX_SLOTS); profit_pct:float=Field(0,ge=0,le=80); reinvest:bool=False; auto:bool=False")
          old="    S['slots']=[{'symbol':clean[i],'tf':TRADING_TF,'auto':False} if i<len(clean) else None for i in range(MAX_SLOTS)];S['profit']=b.profit_pct;S['reinvest']=b.reinvest;return await state()"
          new="    new_slots=[{'symbol':clean[i],'tf':TRADING_TF,'auto':bool(b.auto)} if i<len(clean) else None for i in range(MAX_SLOTS)]\n    for p in list(S['positions']):\n        idx=int(p.get('slot',-1)); new_sym=clean[idx] if 0<=idx<len(clean) else None\n        if new_sym != p.get('symbol'):\n            close_position(p,'MANUAL_REMOVE',p.get('current') or p.get('entry'))\n    S['slots']=new_slots;S['auto_fill_enabled']=bool(b.auto);S['profit']=b.profit_pct;S['reinvest']=b.reinvest;return await state()"
          if old not in s: raise SystemExit('slots block not found')
          s=s.replace(old,new)
          s=s.replace("'source':S['source']}", "'source':S['source'],'auto_fill_enabled':S.get('auto_fill_enabled',True)}")
          s=s.replace("async def autoSlots(){try{let j=await api('/api/state');", "async def autoSlots(){try{let j=await api('/api/state');")
          s=s.replace("await api('/api/slots',{method:'POST',body:JSON.stringify({slots:vals(),profit_pct:parseFloat(($('p').value||'0').replace(',','.')),reinvest:$('reinvest').checked})});", "await api('/api/slots',{method:'POST',body:JSON.stringify({slots:vals(),profit_pct:parseFloat(($('p').value||'0').replace(',','.')),reinvest:$('reinvest').checked,auto:false})});")
          s=s.replace("await setSlots()}catch(e){alert(e.message)}}async function alloc", "await setSlots(true)}catch(e){alert(e.message)}}async function alloc")
          s=s.replace("async function setSlots(){try{editingSlots=false;await api('/api/slots',{method:'POST',body:JSON.stringify({slots:vals(),profit_pct:parseFloat(($('p').value||'0').replace(',','.')),reinvest:$('reinvest').checked})});", "async function setSlots(autoMode=false){try{editingSlots=false;await api('/api/slots',{method:'POST',body:JSON.stringify({slots:vals(),profit_pct:parseFloat(($('p').value||'0').replace(',','.')),reinvest:$('reinvest').checked,auto:autoMode})});")
          p.write_text(s)
      - name: Commit repair and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fast-scalper-repair.yml
          git add app/fast_scalper_v042.py
          git commit -m "Fix paper timeout and manual slot control"
          git push