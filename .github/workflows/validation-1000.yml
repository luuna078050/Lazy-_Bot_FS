name: Validate 1000 trades
on:
  push:
    paths:
      - 'scripts/validate_1000.py'
      - 'app/strategy_intelligence.py'
      - 'app/orderbook_pressure.py'
      - 'tests/test_strategy_intelligence.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run validation
        run: python scripts/validate_1000.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: lazybot-1000-validation
          path: validation_1000_result.json
