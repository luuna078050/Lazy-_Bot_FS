name: LazyBot FS 90-day backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run BTC 90-day chronological backtest
        run: python scripts/backtest_3m.py --symbol BTCUSDT --interval 1h --days 90 --horizon 3
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: lazybot-fs-backtest
          path: backtest_result.json
