name: Set radar interval
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set radar refresh to 7 minutes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text()
          old = 'ROTATE=20'
          new = 'ROTATE=420'
          if old not in s:
              raise SystemExit('ROTATE=20 not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git commit -m 'Set radar refresh interval to 7 minutes' || exit 0
          git push
