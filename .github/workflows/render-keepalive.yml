name: Keep Fast Scalper awake

on:
  schedule:
    # Render Free can sleep after inactivity. Keep inbound traffic below that threshold.
    - cron: "2/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Fast Scalper health
        run: |
          for URL in \
            "https://fast-scalper.onrender.com/api/health" \
            "https://fast-scalper.onrender.com/"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
            echo "$URL -> HTTP $code"
          done
