name: Keep Fast Scalper awake

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    # Ping at minute 2, 7, 12, 17... to stay safely below that limit.
    - cron: "2/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Fast Scalper
        run: |
          URL="https://fast-scalper.onrender.com/health"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
          echo "Fast Scalper response: HTTP $code"
