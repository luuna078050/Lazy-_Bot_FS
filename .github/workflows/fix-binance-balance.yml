name: Fix Binance Test balance
on:
  push:
    branches: [fast-scalper-beta-0.01-repair-paper]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-scalper-beta-0.01-repair-paper
      - name: Patch mode balance sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/fast_scalper_beta_001.py')
          text = p.read_text()
          start = text.index("@app.post('/api/mode')\nasync def mode_fixed")
          end = text.index("\n@app.post('/api/radar')", start)
          new = '''@app.post('/api/mode')
async def mode_fixed(b: legacy.Mode):
    m = b.mode.upper()
    if m not in {'PAPER', 'BINANCE_TEST'}:
        raise HTTPException(403, 'Unsupported mode')
    if S['running'] or S['positions']:
        raise HTTPException(400, 'BOT OFF and no open positions required')
    if m == 'BINANCE_TEST' and not B.testnet:
        raise HTTPException(403, 'BINANCE_TEST requires Binance Testnet')
    S['mode'] = m
    S['bot'] = 0.0
    S['free'] = 0.0
    S['error'] = None
    if m == 'PAPER':
        S['account'] = START
        S['reserve'] = START
    else:
        try:
            await B.ping()
            acc = await B.account()
            free_usdt = next((float(x['free']) for x in acc.get('balances', []) if x.get('asset') == 'USDT'), 0.0)
        except Exception as e:
            S['mode'] = 'PAPER'
            S['account'] = START
            S['reserve'] = START
            S['error'] = f'Binance TEST account check failed: {type(e).__name__}: {e}'
            raise HTTPException(400, S['error'])
        S['account'] = free_usdt
        S['reserve'] = free_usdt
    return await legacy.state()
'''
          p.write_text(text[:start] + new + text[end:])
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/fast_scalper_beta_001.py
          git rm .github/workflows/fix-binance-balance.yml
          git commit -m 'Fix Binance Test balance sync on mode selection'
          git push origin HEAD:fast-scalper-beta-0.01-repair-paper
